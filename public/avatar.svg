<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1329" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Outer Tech Ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="12 8" filter="url(#glow)" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />

  <!-- Avatar Silhouette -->
  <g fill="#cbd5e1" opacity="0.95">
    <!-- Head -->
    <circle cx="200" cy="155" r="50" fill="#94a3b8" />
    <!-- Shoulders / Torso -->
    <path d="M110 285 C110 230, 150 220, 200 220 C250 220, 290 230, 290 285 Z" fill="#64748b" />
    <!-- Tie / Core Accent -->
    <path d="M194 220 L206 220 L202 260 L198 260 Z" fill="#38bdf8" />
  </g>

  <!-- Futuristic Corner Markers -->
  <path d="M40 70 L40 40 L70 40" stroke="#a855f7" stroke-width="3" fill="none" />
  <path d="M360 70 L360 40 L330 40" stroke="#38bdf8" stroke-width="3" fill="none" />
  <path d="M40 330 L40 360 L70 360" stroke="#06b6d4" stroke-width="3" fill="none" />
  <path d="M360 330 L360 360 L330 360" stroke="#a855f7" stroke-width="3" fill="none" />

  <!-- Text -->
  <text x="200" y="325" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
    PEDDI REDDY LEELA ANIRUDH REDDY
  </text>
  <text x="200" y="345" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
    AI &amp; FULL-STACK DEVELOPER
  </text>
</svg>
